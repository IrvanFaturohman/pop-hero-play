<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Pop Hero</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2b2118;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #unity-canvas {
        position: absolute;
        display: block;
        background: #231F20;
        outline: none;
      }
      #loading {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 50%;
        max-width: 240px;
        transform: translate(-50%, -50%);
        font: 600 16px system-ui, sans-serif;
        color: #fff;
        text-align: center;
        text-shadow: 0 2px 0 #000;
      }
      #bar {
        margin-top: 10px;
        height: 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      #fill {
        width: 0;
        height: 100%;
        background: #ffd23f;
        transition: width 0.15s;
      }
      #error {
        display: none;
        position: absolute;
        left: 16px;
        right: 16px;
        top: 16px;
        padding: 10px;
        background: #b33;
        color: #fff;
        font: 14px system-ui, sans-serif;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading...<div id="bar"><div id="fill"></div></div></div>
    <div id="error"></div>
    <script>
      // Port 1:1 dari web: area main 9:16. Layar lebih lebar (desktop, tablet landscape) dikasih
      // letterbox; HP yang lebih tinggi dari 9:16 diisi penuh, kamera Unity yang nambah langit/tanah.
      var canvas = document.querySelector("#unity-canvas");
      var Aspect = 9 / 16;
      function fit() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var cw = w / h > Aspect ? Math.round(h * Aspect) : w;
        canvas.style.width = cw + "px";
        canvas.style.height = h + "px";
        canvas.style.left = Math.round((w - cw) / 2) + "px";
        canvas.style.top = "0px";
      }
      window.addEventListener("resize", fit);
      fit();
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      function showError(message) {
        var el = document.querySelector("#error");
        el.textContent = message;
        el.style.display = "block";
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "IrvanFaturohman",
        productName: "Pop Hero",
        productVersion: "1.0",
        // layar retina 3x bikin GPU HP murah ngos-ngosan; 2x udah tajam buat art kartun
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) {
          if (type === "error") showError(msg);
          else console.warn(msg);
        },
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
        }).catch(showError);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
